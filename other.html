<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Other | Armaan Raina</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
    <style>
        .other-intro {
            padding-bottom: 3rem;
        }

        .caldwell-section {
            padding: 0 0 6rem;
        }

        .caldwell-lead {
            max-width: 42rem;
            color: var(--color-ink-faded);
            font-size: 1.05rem;
            margin-bottom: 3.5rem;
        }

        .caldwell-stories {
            display: grid;
            gap: 4rem;
        }

        .caldwell-story {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(260px, 38%);
            gap: 3rem;
            align-items: center;
            padding: 2.5rem 0;
            border-top: 1px solid var(--color-border);
        }

        .caldwell-story:first-child {
            border-top: none;
            padding-top: 0;
        }

        .caldwell-story.reverse {
            grid-template-columns: minmax(260px, 38%) minmax(0, 1fr);
        }

        .caldwell-story.reverse .caldwell-copy {
            order: 2;
        }

        .caldwell-story.reverse .caldwell-media {
            order: 1;
        }

        .caldwell-copy h3 {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }

        .caldwell-copy p {
            color: var(--color-ink-faded);
            margin-bottom: 1rem;
        }

        .caldwell-media img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            border: 1px solid var(--color-border);
        }

        .gallery-section {
            padding: 5rem 0 6rem;
            border-top: 1px solid var(--color-border);
        }

        .gallery-section-header {
            max-width: 1200px;
            margin: 0 auto 2.5rem;
            padding: 0 2.5rem;
        }

        .gallery-section-header h2 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 4vw, 2.75rem);
            font-weight: 400;
            margin-bottom: 0.75rem;
        }

        .gallery-section-header p {
            color: var(--color-ink-faded);
            max-width: 36rem;
            font-size: 1.05rem;
        }

        .gallery-fullbleed {
            width: 100vw;
            margin-left: calc(50% - 50vw);
            overflow: hidden;
            padding: 1.5rem 0 2rem;
        }

        .gallery {
            position: relative;
            overflow: hidden;
            padding: 0.5rem 0;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .gallery-row {
            display: flex;
            gap: 1.25rem;
            animation: scroll 140s linear infinite;
            width: max-content;
        }

        .gallery-row:nth-child(2) {
            animation: scroll-reverse 140s linear infinite;
        }

        .gallery-row:hover {
            animation-play-state: paused;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes scroll-reverse {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            width: clamp(220px, 22vw, 340px);
            height: clamp(220px, 22vw, 340px);
            flex-shrink: 0;
            border-radius: 2px;
            cursor: pointer;
            border: 1px solid var(--color-border);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
            z-index: 10;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.06);
        }

        .gallery-section.food-band {
            background: white;
        }

        .gallery-section.photo-band {
            background: var(--color-cream);
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 26, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 4px;
        }

        .lightbox-close {
            position: absolute;
            top: -3rem;
            right: 0;
            background: none;
            border: none;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            line-height: 1;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 1rem;
            border-radius: 4px;
        }

        .lightbox-prev { left: 1rem; }
        .lightbox-next { right: 1rem; }

        @media (max-width: 900px) {
            .caldwell-story,
            .caldwell-story.reverse {
                grid-template-columns: 1fr;
            }

            .caldwell-story.reverse .caldwell-copy,
            .caldwell-story.reverse .caldwell-media {
                order: unset;
            }
        }

        @media (max-width: 600px) {
            .gallery-section-header {
                padding: 0 1.5rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="index.html" class="nav-name">Armaan Raina</a>
            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="research.html">Research</a></li>
                <li><a href="projects.html">Building &amp; Teaching</a></li>
                <li><a href="resume.html">Resume</a></li>
                <li><a href="other.html">Other</a></li>
            </ul>
        </div>
    </nav>

    <section class="page-header other-intro">
        <div class="section-inner">
            <h1 class="page-title">Beyond the Lab</h1>
        </div>
    </section>


    <section class="gallery-section food-band">
        <div class="gallery-section-header">
            <h2>Food</h2>
            <p>A collection of the best meals I've cooked or eaten</p>
        </div>
        <div class="gallery-fullbleed">
            <div class="gallery" data-gallery="food" id="food-gallery"></div>
        </div>
    </section>

    <section class="gallery-section photo-band">
        <div class="gallery-section-header">
            <h2>Photography</h2>
            <p>My favorite shots I've taken</p>
        </div>
        <div class="gallery-fullbleed">
            <div class="gallery" data-gallery="photo" id="photo-gallery"></div>
        </div>
    </section>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" type="button" onclick="closeLightbox()" aria-label="Close">&times;</button>
            <button class="lightbox-nav lightbox-prev" type="button" onclick="changeImage(-1)" aria-label="Previous">‹</button>
            <img id="lightbox-img" src="" alt="">
            <button class="lightbox-nav lightbox-next" type="button" onclick="changeImage(1)" aria-label="Next">›</button>
        </div>
    </div>

    <script src="js/nav.js"></script>
    <script>
        let currentGallery = [];
        let currentIndex = 0;

        const foodImages = [
            { src: 'images/pizza.webp', alt: 'Pizza' },
            { src: 'images/dumplings.webp', alt: 'Dumplings' },
            { src: 'images/noodles.webp', alt: 'Noodles' },
            { src: 'images/ribeye.webp', alt: 'Ribeye' },
            { src: 'images/shawarma.webp', alt: 'Shawarma' },
            { src: 'images/tostadas.webp', alt: 'Tostadas' },
            { src: 'images/inandout.webp', alt: 'In-N-Out' },
            { src: 'images/mac.webp', alt: 'Mac and Cheese' },
            { src: 'images/pchick.webp', alt: 'Chicken' },
            { src: 'images/sugarfire.webp', alt: 'BBQ' },
            { src: 'images/terrybs.webp', alt: "Terry B's" },
            { src: 'images/pappys.webp', alt: "Pappy's" },
            { src: 'images/mex.webp', alt: 'Mexican Food' },
            { src: 'images/pocohavana.webp', alt: 'Poco Havana' },
            { src: 'images/tripdip.webp', alt: 'Triple Dip' },
            { src: 'images/hamachi.webp', alt: 'Hamachi' },
            { src: 'images/poutin.webp', alt: 'Poutine' },
            { src: 'images/pupusas.webp', alt: 'Pupusas' },
            { src: 'images/dank.jpg', alt: 'Dank' },
            { src: 'images/hurst.webp', alt: 'Steak' },
            { src: 'images/picnic.webp', alt: 'Picnic' },
            { src: 'images/youarewhatyoueat.webp', alt: 'Jerk' }
        ];

        const photoImages = [
            { src: 'images/mountains.webp', alt: 'Mountains' },
            { src: 'images/canyon.webp', alt: 'Canyon' },
            { src: 'images/falls.webp', alt: 'Waterfall' },
            { src: 'images/bridge.webp', alt: 'Bridge' },
            { src: 'images/reflection.webp', alt: 'Reflection' },
            { src: 'images/riverview.webp', alt: 'River View' },
            { src: 'images/mayanruins.webp', alt: 'Mayan Ruins' },
            { src: 'images/water.webp', alt: 'Water' },
            { src: 'images/minifalls.webp', alt: 'Small Waterfall' },
            { src: 'images/grass.webp', alt: 'Grass' },
            { src: 'images/blue.webp', alt: 'Blue Sky' },
            { src: 'images/purple.webp', alt: 'Purple Sunset' },
            { src: 'images/pink.webp', alt: 'Pink Sky' },
            { src: 'images/layers.webp', alt: 'Mountain Layers' },
            { src: 'images/cotton.webp', alt: 'Cotton Clouds' },
            { src: 'images/align.webp', alt: 'Alignment' },
            { src: 'images/history.webp', alt: 'Historic Site' },
            { src: 'images/spawnpoint.webp', alt: 'Spawn Point' },
            { src: 'images/whenIwasledtoyou.webp', alt: 'When I Was Led To You' },
            { src: 'images/wildwildwest.webp', alt: 'Wild Wild West' },
            { src: 'images/creekreflection.webp', alt: 'Creek Reflection' },
            { src: 'images/mountainsunrise.webp', alt: 'Mountain Sunrise' },
            { src: 'images/quarry.webp', alt: 'Quarry' },
            { src: 'images/bean.webp', alt: 'Bean' },
            { src: 'images/coco.webp', alt: 'Beach' },
            { src: 'images/shiny.jpg', alt: 'Beach' }
        ];

        function createCarousel(containerId, images) {
            const container = document.getElementById(containerId);
            const midpoint = Math.ceil(images.length / 2);
            const row1Images = images.slice(0, midpoint);
            const row2Images = images.slice(midpoint);

            function buildRow(rowImages, rowOffset) {
                const row = document.createElement('div');
                row.className = 'gallery-row';
                for (let dup = 0; dup < 2; dup++) {
                    rowImages.forEach((img, index) => {
                        const item = document.createElement('div');
                        item.className = 'gallery-item';
                        item.dataset.index = rowOffset + index;
                        item.dataset.gallery = containerId;
                        const imgEl = document.createElement('img');
                        imgEl.src = img.src;
                        imgEl.alt = img.alt;
                        item.appendChild(imgEl);
                        row.appendChild(item);
                    });
                }
                return row;
            }

            container.appendChild(buildRow(row1Images, 0));
            container.appendChild(buildRow(row2Images, midpoint));
        }

        createCarousel('food-gallery', foodImages);
        createCarousel('photo-gallery', photoImages);

        setTimeout(() => {
            document.querySelectorAll('.gallery-item').forEach((item) => {
                item.addEventListener('click', function () {
                    const galleryId = this.dataset.gallery;
                    const images = galleryId === 'food-gallery' ? foodImages : photoImages;
                    currentGallery = images.map((img) => img.src);
                    currentIndex = parseInt(this.dataset.index, 10);
                    openLightbox(currentGallery[currentIndex]);
                });
            });
        }, 100);

        function openLightbox(imageSrc) {
            document.getElementById('lightbox-img').src = imageSrc;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function changeImage(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = currentGallery.length - 1;
            else if (currentIndex >= currentGallery.length) currentIndex = 0;
            document.getElementById('lightbox-img').src = currentGallery[currentIndex];
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
            else if (e.key === 'ArrowLeft') changeImage(-1);
            else if (e.key === 'ArrowRight') changeImage(1);
        });

        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });
    </script>
</body>
</html>
