<header class="page-head shell">
  <h1>Photography</h1>
</header>

<div class="filmstrip-wrap">
  <div class="filmstrip" id="filmstrip"></div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-content">
    <button class="lightbox-close" type="button" onclick="closeLightbox()" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" type="button" onclick="changeImage(-1)" aria-label="Previous">&lsaquo;</button>
    <img id="lightbox-img" src="" alt="">
    <button class="lightbox-nav lightbox-next" type="button" onclick="changeImage(1)" aria-label="Next">&rsaquo;</button>
  </div>
</div>

<script>
let currentIndex = 0;

const images = [
  { src: 'images/mountains.webp', alt: 'Mountains' },
  { src: 'images/canyon.webp', alt: 'Canyon' },
  { src: 'images/falls.webp', alt: 'Waterfall' },
  { src: 'images/bridge.webp', alt: 'Bridge' },
  { src: 'images/reflection.webp', alt: 'Reflection' },
  { src: 'images/riverview.webp', alt: 'River View' },
  { src: 'images/mayanruins.webp', alt: 'Mayan Ruins' },
  { src: 'images/water.webp', alt: 'Water' },
  { src: 'images/minifalls.webp', alt: 'Small Waterfall' },
  { src: 'images/grass.webp', alt: 'Grass' },
  { src: 'images/blue.webp', alt: 'Blue Sky' },
  { src: 'images/purple.webp', alt: 'Purple Sunset' },
  { src: 'images/pink.webp', alt: 'Pink Sky' },
  { src: 'images/layers.webp', alt: 'Mountain Layers' },
  { src: 'images/cotton.webp', alt: 'Cotton Clouds' },
  { src: 'images/align.webp', alt: 'Alignment' },
  { src: 'images/history.webp', alt: 'Historic Site' },
  { src: 'images/spawnpoint.webp', alt: 'Spawn Point' },
  { src: 'images/whenIwasledtoyou.webp', alt: 'When I Was Led To You' },
  { src: 'images/wildwildwest.webp', alt: 'Wild Wild West' },
  { src: 'images/creekreflection.webp', alt: 'Creek Reflection' },
  { src: 'images/mountainsunrise.webp', alt: 'Mountain Sunrise' },
  { src: 'images/quarry.webp', alt: 'Quarry' },
  { src: 'images/bean.webp', alt: 'Bean' },
  { src: 'images/coco.webp', alt: 'Beach' },
  { src: 'images/shiny.jpg', alt: 'Beach' }
];

function buildFilmstrip(containerId, images) {
  const container = document.getElementById(containerId);
  const midpoint = Math.ceil(images.length / 2);
  const row1 = images.slice(0, midpoint);
  const row2 = images.slice(midpoint);

  function buildRow(rowImages, rowOffset, reverse) {
    const row = document.createElement('div');
    row.className = 'filmstrip-row' + (reverse ? ' reverse' : '');
    for (let dup = 0; dup < 2; dup++) {
      rowImages.forEach((img, i) => {
        const item = document.createElement('div');
        item.className = 'filmstrip-item';
        const imgEl = document.createElement('img');
        imgEl.src = img.src;
        imgEl.alt = img.alt;
        imgEl.loading = 'lazy';
        item.appendChild(imgEl);
        item.addEventListener('click', function(){ openLightbox(rowOffset + i); });
        row.appendChild(item);
      });
    }
    return row;
  }

  container.appendChild(buildRow(row1, 0, false));
  container.appendChild(buildRow(row2, midpoint, true));
}

buildFilmstrip('filmstrip', images);

function openLightbox(index) {
  currentIndex = index;
  var img = document.getElementById('lightbox-img');
  img.src = images[currentIndex].src;
  img.alt = images[currentIndex].alt;
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = 'auto';
}

function changeImage(direction) {
  currentIndex = (currentIndex + direction + images.length) % images.length;
  var img = document.getElementById('lightbox-img');
  img.src = images[currentIndex].src;
  img.alt = images[currentIndex].alt;
}

document.addEventListener('keydown', function(e){
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') changeImage(-1);
  else if (e.key === 'ArrowRight') changeImage(1);
});

document.getElementById('lightbox').addEventListener('click', function(e){
  if (e.target.id === 'lightbox') closeLightbox();
});
</script>
