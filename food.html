<header class="page-head shell">
  <h1>Food</h1>
</header>

<div class="filmstrip-wrap">
  <div class="filmstrip" id="filmstrip"></div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-content">
    <button class="lightbox-close" type="button" onclick="closeLightbox()" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" type="button" onclick="changeImage(-1)" aria-label="Previous">&lsaquo;</button>
    <img id="lightbox-img" src="" alt="">
    <button class="lightbox-nav lightbox-next" type="button" onclick="changeImage(1)" aria-label="Next">&rsaquo;</button>
  </div>
</div>

<script>
let currentIndex = 0;

const images = [
  { src: 'images/pizza.webp', alt: 'Pizza' },
  { src: 'images/dumplings.webp', alt: 'Dumplings' },
  { src: 'images/noodles.webp', alt: 'Noodles' },
  { src: 'images/ribeye.webp', alt: 'Ribeye' },
  { src: 'images/shawarma.webp', alt: 'Shawarma' },
  { src: 'images/tostadas.webp', alt: 'Tostadas' },
  { src: 'images/inandout.webp', alt: 'In-N-Out' },
  { src: 'images/mac.webp', alt: 'Mac and Cheese' },
  { src: 'images/pchick.webp', alt: 'Chicken' },
  { src: 'images/sugarfire.webp', alt: 'BBQ' },
  { src: 'images/terrybs.webp', alt: "Terry B's" },
  { src: 'images/pappys.webp', alt: "Pappy's" },
  { src: 'images/mex.webp', alt: 'Mexican Food' },
  { src: 'images/pocohavana.webp', alt: 'Poco Havana' },
  { src: 'images/tripdip.webp', alt: 'Triple Dip' },
  { src: 'images/hamachi.webp', alt: 'Hamachi' },
  { src: 'images/poutin.webp', alt: 'Poutine' },
  { src: 'images/pupusas.webp', alt: 'Pupusas' },
  { src: 'images/dank.jpg', alt: 'Dank' },
  { src: 'images/hurst.webp', alt: 'Steak' },
  { src: 'images/picnic.webp', alt: 'Picnic' },
  { src: 'images/youarewhatyoueat.webp', alt: 'Jerk' }
];

function buildFilmstrip(containerId, images) {
  const container = document.getElementById(containerId);
  const midpoint = Math.ceil(images.length / 2);
  const row1 = images.slice(0, midpoint);
  const row2 = images.slice(midpoint);

  function buildRow(rowImages, rowOffset, reverse) {
    const row = document.createElement('div');
    row.className = 'filmstrip-row' + (reverse ? ' reverse' : '');
    for (let dup = 0; dup < 2; dup++) {
      rowImages.forEach((img, i) => {
        const item = document.createElement('div');
        item.className = 'filmstrip-item';
        const imgEl = document.createElement('img');
        imgEl.src = img.src;
        imgEl.alt = img.alt;
        imgEl.loading = 'lazy';
        item.appendChild(imgEl);
        item.addEventListener('click', function(){ openLightbox(rowOffset + i); });
        row.appendChild(item);
      });
    }
    return row;
  }

  container.appendChild(buildRow(row1, 0, false));
  container.appendChild(buildRow(row2, midpoint, true));
}

buildFilmstrip('filmstrip', images);

function openLightbox(index) {
  currentIndex = index;
  var img = document.getElementById('lightbox-img');
  img.src = images[currentIndex].src;
  img.alt = images[currentIndex].alt;
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = 'auto';
}

function changeImage(direction) {
  currentIndex = (currentIndex + direction + images.length) % images.length;
  var img = document.getElementById('lightbox-img');
  img.src = images[currentIndex].src;
  img.alt = images[currentIndex].alt;
}

document.addEventListener('keydown', function(e){
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') changeImage(-1);
  else if (e.key === 'ArrowRight') changeImage(1);
});

document.getElementById('lightbox').addEventListener('click', function(e){
  if (e.target.id === 'lightbox') closeLightbox();
});
</script>
